# PIPELINE INSTRUCTIONS
make_temp_pickle_after_preprocessing: "yes" # yes: make pickle files, no: do not make pickle files
make_supertables: "no" # yes: make supertables, no: do not make supertables


# FILE PATHS
data_path: "/hpc/group/kamaleswaranlab/mimic_iv/mimic_flat_files"
